[deploy]
restartPolicyType = "on_failure"
startCommand = "python manage.py collectstatic --no-input && python -c \"import django; django.setup(); print('Django OK')\" 2>&1 && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -"
healthcheckPath = "/health/"
healthcheckTimeout = 300
